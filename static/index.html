<!DOCTYPE html>
<html lang="mm" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Monthly Savings</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E%E1%80%80%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <div class="sidebar-backdrop" id="backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">က</div>
        <div class="brand-text">
          <div class="brand-title" id="brand-title">Monthly Savings</div>
          <div class="brand-sub" id="brand-sub">Group savings manager</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" type="button" id="sidebar-lang">EN / မြန်</button>
        <button class="ghost-btn" type="button" id="sidebar-theme" title="Theme">◐</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu">☰</button>
        <div class="page-title" id="page-title"></div>
        <div class="topbar-tools">
          <div class="search-wrap" id="search-wrap">
            <input id="global-search" type="search" placeholder="Search…" autocomplete="off" />
            <div class="search-results" id="search-results" hidden></div>
          </div>
          <select id="month-picker" class="select" aria-label="Month"></select>
          <select id="year-picker" class="select" aria-label="Year"></select>
          <button class="primary-btn admin-only" id="quick-pay" type="button"></button>
          <button class="primary-btn" id="auth-btn" type="button"></button>
        </div>
      </header>

      <main class="content">
        <div id="locked-slot"></div>
        <div id="view" class="fade-in"></div>
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="login-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="tooltip" class="tooltip"></div>

  <script src="js/i18n.js"></script>
  <script src="js/amount.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
